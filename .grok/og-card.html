<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="og-fonts/local.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #F3F1EC;
    }
    .card {
      width: 1200px;
      height: 630px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      padding-top: 8px;
      background: #F3F1EC;
      color: #1C1B18;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 22px;
      border: 1px solid #E3DDD3;
      pointer-events: none;
    }
    .bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: #1E3D38;
    }
    .lockup {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .kicker {
      font-family: "Source Sans 3", "Liberation Sans", sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #6E685F;
    }
    h1 {
      margin-top: 18px;
      font-family: "Source Serif 4", "Liberation Serif", Georgia, serif;
      font-weight: 600;
      font-variation-settings: "opsz" 60, "wght" 600;
      font-optical-sizing: auto;
      font-variant-numeric: lining-nums;
      letter-spacing: -0.035em;
      line-height: 0.82;
      color: #1C1B18;
    }
    h1 .name {
      display: block;
      font-size: 92px;
    }
    h1 .year {
      display: block;
      margin-top: 8px;
      font-size: 132px;
      color: #1E3D38;
      letter-spacing: -0.045em;
    }
    .rule {
      width: 56px;
      height: 2px;
      margin: 22px auto 0;
      background: #1E3D38;
    }
    .sub {
      margin-top: 16px;
      font-family: "Source Sans 3", "Liberation Sans", sans-serif;
      font-weight: 500;
      font-size: 22px;
      letter-spacing: 0.01em;
      color: #6E685F;
    }
    .sheet {
      position: relative;
      width: 760px;
      background: #FBFAF8;
      border: 1px solid #CFC7BB;
      box-shadow: 0 1px 0 rgba(28, 27, 24, 0.04), 0 10px 24px rgba(28, 27, 24, 0.05);
    }
    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 10px 16px 9px;
      border-bottom: 1px solid #E3DDD3;
      font-family: "Source Sans 3", "Liberation Sans", sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6E685F;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 10px 18px;
      padding: 14px 16px 16px;
    }
    .task {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .num {
      width: 14px;
      font-family: "Source Sans 3", "Liberation Sans", sans-serif;
      font-weight: 600;
      font-size: 13px;
      font-variant-numeric: tabular-nums lining-nums;
      color: #1E3D38;
      text-align: right;
    }
    .cells {
      display: flex;
      gap: 4px;
    }
    .cells i {
      display: grid;
      place-items: center;
      width: 28px;
      height: 34px;
      border: 1.5px solid #1C1B18;
      background: #F3F1EC;
      font-style: normal;
      font-family: "Source Serif 4", Georgia, serif;
      font-weight: 600;
      font-size: 17px;
      font-variant-numeric: lining-nums;
      color: #1C1B18;
      line-height: 1;
    }
    .cells i.empty {
      background: #FBFAF8;
      border-color: #C9C2B6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="bar"></div>
    <div class="lockup">
      <div class="kicker">ЕГЭ 2027 · демоверсия</div>
      <h1>
        <span class="name">Профиль</span>
        <span class="year">27</span>
      </h1>
      <div class="rule"></div>
      <p class="sub">профильная математика</p>
    </div>
    <div class="sheet" aria-hidden="true">
      <div class="sheet-head">
        <span>Бланк ответов</span>
        <span>№ 1–8</span>
      </div>
      <div class="grid">
        <div class="task"><span class="num">1</span><span class="cells"><i>1</i><i>2</i><i class="empty"></i></span></div>
        <div class="task"><span class="num">2</span><span class="cells"><i>−</i><i>3</i><i class="empty"></i></span></div>
        <div class="task"><span class="num">3</span><span class="cells"><i>0</i><i>,</i><i>5</i></span></div>
        <div class="task"><span class="num">4</span><span class="cells"><i>1</i><i>1</i><i class="empty"></i></span></div>
        <div class="task"><span class="num">5</span><span class="cells"><i>6</i><i class="empty"></i><i class="empty"></i></span></div>
        <div class="task"><span class="num">6</span><span class="cells"><i>2</i><i>4</i><i class="empty"></i></span></div>
        <div class="task"><span class="num">7</span><span class="cells"><i>1</i><i>5</i><i class="empty"></i></span></div>
        <div class="task"><span class="num">8</span><span class="cells"><i>4</i><i class="empty"></i><i class="empty"></i></span></div>
      </div>
    </div>
  </div>
</body>
</html>
